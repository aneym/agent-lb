
global:

  imageRegistry: ""

  imagePullSecrets: []

  storageClass: ""

  nodeSelector: {}



nameOverride: ""

fullnameOverride: ""

commonLabels: {}

commonAnnotations: {}

revisionHistoryLimit: 3


image:



  registry: ghcr.io

  repository: aneym/agent-lb

  tag: ""

  digest: ""

  pullPolicy: IfNotPresent

  pullSecrets: []



replicaCount: 2

podManagementPolicy: Parallel
updateStrategy:

  type: RollingUpdate
  rollingUpdate:

    partition: 0

terminationGracePeriodSeconds: 60

preStopSleepSeconds: 15
resources:
  requests:

    cpu: 200m

    memory: 256Mi
  limits:

    cpu: 1000m

    memory: 1Gi

extraEnv: []

extraEnvFrom: []

extraVolumes: []

extraVolumeMounts: []


podSecurityContext:

  runAsNonRoot: true

  runAsUser: 1000

  fsGroup: 1000
  seccompProfile:

    type: RuntimeDefault
containerSecurityContext:

  allowPrivilegeEscalation: false

  readOnlyRootFilesystem: true
  capabilities:

    drop:
      - ALL
serviceAccount:

  create: true

  name: ""

  annotations: {}

  automount: false




config:

  databaseMigrateOnStartup: false




  databasePoolSize: 5

  databaseMaxOverflow: 5

  upstreamBaseUrl: ""

  upstreamConnectTimeout: 10

  upstreamStreamTransport: auto

  logFormat: json

  leaderElectionEnabled: true

  leaderElectionTtlSeconds: 30

  circuitBreakerEnabled: true

  circuitBreakerFailureThreshold: 5

  circuitBreakerRecoveryTimeoutSeconds: 60

  backpressureMaxConcurrentRequests: 200

  shutdownDrainTimeoutSeconds: 30

  httpConnectorLimit: 100

  httpConnectorLimitPerHost: 50

  cacheAffinityMaxAgeSeconds: 1800

  promptCacheKeyDerivationEnabled: true

  sessionBridgeEnabled: true

  sessionBridgeIdleTtlSeconds: 120

  sessionBridgeCodexIdleTtlSeconds: 900

  sessionBridgeCodexPrewarmEnabled: true

  sessionBridgeMaxSessions: 256

  sessionBridgeQueueLimit: 8

  sessionBridgeInstanceRing: ""

  sessionBridgeAdvertiseBaseUrl: ""

  stickySessionCleanupEnabled: true

  stickySessionCleanupIntervalSeconds: 300


auth:

  existingSecret: ""

  encryptionKey: ""
  secretKeys:

    databaseUrl: database-url

    encryptionKey: encryption-key
externalSecrets:

  enabled: false

  secretStoreRef:
    name: ""
    kind: SecretStore

  refreshInterval: 1h
rollout:
  reloader:

    enabled: false

  manualToken: ""


pdb:

  create: true

  maxUnavailable: 1

  minAvailable: ""
autoscaling:

  enabled: false

  minReplicas: 2

  maxReplicas: 10

  targetCPUUtilizationPercentage: 70

  targetMemoryUtilizationPercentage: 0
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
affinity:

  podAntiAffinity: soft

topologySpreadConstraints: []

nodeSelector: {}

tolerations: []

priorityClassName: ""


service:

  type: ClusterIP

  port: 2455

  nodePort: ""

  loadBalancerIP: ""

  loadBalancerSourceRanges: []

  annotations: {}


clusterDomain: cluster.local
networkPolicy:

  enabled: false

  ingressNSMatchLabels: {}

  extraIngress: []

  extraEgress: []


ingress:

  enabled: false

  ingressClassName: ""

  annotations: {}

  hosts:
    - host: agent-lb.example.com
      paths:
        - path: /
          pathType: Prefix

  tls: []
  certManager:

    enabled: false

    clusterIssuer: letsencrypt-prod
  nginx:

    enabled: false


    upstreamHashBy: "$http_authorization"

    upstreamHashBySubset: false

    upstreamHashBySubsetSize: 3
  responses:

    enabled: true

    pathType: Exact

    paths:
      - /v1/responses
      - /backend-api/codex/responses
    nginx:

      upstreamHashBy: "$codex_responses_hash_key"

      configurationSnippet: |
        set $codex_responses_hash_key "$http_authorization:$request_id";
        if ($http_x_codex_session_id != "") {
          set $codex_responses_hash_key $http_x_codex_session_id;
        }

      upstreamHashBySubset: false

      upstreamHashBySubsetSize: 3

      proxyNextUpstream: "error timeout http_502 http_503 http_504 invalid_header"

      proxyNextUpstreamTries: 2


gatewayApi:

  enabled: false

  parentRefs:
    - name: gateway
      namespace: gateway-system

  hostnames: []

  annotations: {}


metrics:

  enabled: true

  port: 9090
  serviceMonitor:








    enabled: false

    interval: 30s

    scrapeTimeout: ""

    additionalLabels: {}

    relabelings: []
  prometheusRule:



    enabled: false

    additionalLabels: {}

    additionalRules: []
  grafanaDashboard:

    enabled: false

    folder: agent-lb


tracing:

  enabled: false

  endpoint: ""


postgresql:

  enabled: true
  auth:

    username: agentlb

    password: changeme

    database: agentlb
  primary:
    persistence:

      enabled: true

      size: 8Gi
externalDatabase:










  url: ""

  host: ""

  port: 5432

  database: agentlb

  user: agentlb

  existingSecret: ""


dbInit:

  enabled: false

  host: ""

  port: "5432"

  adminUser: "adminuser"

  adminPassword: ""

  adminPasswordSecret: {}



  databases:
    - name: agentlb
      user: agentlb
      password: changeme


migration:

  enabled: true

  serviceSelectorMode: auto

  backoffLimit: 3

  activeDeadlineSeconds: 300
  schemaGate:

    enabled: true

    timeoutSeconds: 300

    intervalSeconds: 2
  resources:
    requests:

      cpu: 100m

      memory: 128Mi
    limits:

      cpu: 500m

      memory: 256Mi
