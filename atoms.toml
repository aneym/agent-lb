version = 1
[defaults]
always = ["AGENTS.md", "products.json", "Makefile"]
meta = [".github", ".githooks", ".filecap.json", ".filecap-cutover.json", ".filecap-final.json", "check", "atoms.toml", ".atoms-unowned.json", "uv.lock", "pyproject.toml", "frontend/bun.lock", "frontend/package.json"]
unowned_baseline = ".atoms-unowned.json"
full = "./check --full"

[atom.app]
paths = ["app"]
check = "make test-floor"
owner = "agent-lb-lead"
deps = ["bin", "clients", "config", "deploy", "docs", "features", "frontend", "openspec", "patches", "scripts", "tests"]

[atom.bin]
paths = ["bin"]
check = "./check --full"
owner = "agent-lb-lead"
deps = ["app", "clients", "config", "deploy", "docs", "features", "frontend", "openspec", "patches", "scripts", "tests"]

